[project]
name = "shop-agent"
version = "0.1.0"
description = "AI 电商店铺装修 Agent —— LangGraph 编排范式完整实现（interrupt / Send / checkpointer / 占位回填）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # 编排框架：1.0 起为稳定 API（interrupt / Send / Command / RetryPolicy）
    "langgraph>=1.0",
    # SqliteSaver 自 0.2 起从 langgraph 主包拆出，需单独安装
    "langgraph-checkpoint-sqlite>=2.0",
    # OpenAI 兼容协议客户端：GLM / Qwen / DeepSeek 等供应商均兼容，改一行配置即可切换
    "openai>=1.60",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # 终端交互与结构化输出展示
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
shop-agent = "shop_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
